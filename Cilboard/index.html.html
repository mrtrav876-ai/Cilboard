<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cilboard — write, edit, finish.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --bg: #EFE9D8;
    --surface: #FBF8F0;
    --surface-2: #E4DCC2;
    --text: #241F14;
    --text-muted: #6B6250;
    --accent: #8C6423;
    --accent-strong: #6E4E19;
    --accent-contrast: #FBF8F0;
    --danger: #8C3A34;
    --border: #D8CDA9;
    --editor-bg: #FFFFFF;
    --editor-text: #2A2417;
    --shadow: rgba(40,30,10,0.14);
    --focus-ring: #8C6423;

    --font-display: 'Newsreader', Georgia, 'Times New Roman', serif;
    --font-body: 'Newsreader', Georgia, 'Times New Roman', serif;
    --font-ui: 'Work Sans', -apple-system, BlinkMacSystemFont, sans-serif;

    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #17151F;
      --surface: #1F1B2A;
      --surface-2: #262138;
      --text: #ECE7DA;
      --text-muted: #A79FBE;
      --accent: #D8B15E;
      --accent-strong: #EAC981;
      --accent-contrast: #1B1B2F;
      --danger: #D97D77;
      --border: #322C44;
      --editor-bg: #F3EDDD;
      --editor-text: #2A2417;
      --shadow: rgba(0,0,0,0.45);
      --focus-ring: #D8B15E;
    }
  }

  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #17151F;
    --surface: #1F1B2A;
    --surface-2: #262138;
    --text: #ECE7DA;
    --text-muted: #A79FBE;
    --accent: #D8B15E;
    --accent-strong: #EAC981;
    --accent-contrast: #1B1B2F;
    --danger: #D97D77;
    --border: #322C44;
    --editor-bg: #F3EDDD;
    --editor-text: #2A2417;
    --shadow: rgba(0,0,0,0.45);
    --focus-ring: #D8B15E;
  }

  html, body { height: 100%; }
  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-ui);
    -webkit-font-smoothing: antialiased;
    min-height: 100%;
    display: flex;
    flex-direction: column;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }

  a, button, input, select, textarea { font-family: inherit; color: inherit; }

  button {
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    border-radius: 3px;
    padding: 0.5rem 0.9rem;
    font-size: 0.88rem;
    font-family: var(--font-ui);
  }
  button:hover { border-color: var(--accent); }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: 0.5; cursor: default; transform: none; }

  button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-contrast);
    font-weight: 600;
  }
  button.primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); }

  button.quiet { background: transparent; border-color: transparent; }
  button.quiet:hover { border-color: var(--border); }

  button.danger-text { color: var(--danger); }

  :focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }

  input[type="text"], input[type="email"], input[type="password"], input[type="search"], select, textarea {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 3px;
    padding: 0.5rem 0.7rem;
    font-size: 0.9rem;
    width: 100%;
  }

  /* ---------- Header ---------- */
  .topbar {
    position: sticky;
    top: 0;
    padding-top: env(safe-area-inset-top, 0px);
    z-index: 20;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 1rem;
    padding-left: 1.25rem;
    padding-right: 1.25rem;
    height: calc(3.5rem + env(safe-area-inset-top, 0px));
  }

  .brand {
    font-family: var(--font-display);
    font-style: italic;
    font-weight: 600;
    font-size: 1.4rem;
    letter-spacing: 0.01em;
    white-space: nowrap;
  }

  .topbar nav { display: flex; gap: 0.5rem; flex: 1; overflow-x: auto; }
  .topbar-right { display: flex; gap: 0.5rem; align-items: center; }
  .account-email {
    font-size: 0.78rem;
    color: var(--text-muted);
    white-space: nowrap;
    max-width: 160px;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ---------- Layout shell ---------- */
  #app { flex: 1; display: flex; flex-direction: column; min-height: 0; }

  main {
    flex: 1;
    width: 100%;
    max-width: 960px;
    margin: 0 auto;
    padding: 1.5rem 1.25rem 3rem;
    min-height: 0;
  }

  /* ---------- Auth ---------- */
  .auth-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.25rem;
  }
  .auth-card {
    width: 100%;
    max-width: 380px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 2rem 1.75rem 1.75rem;
  }
  .auth-brand {
    font-family: var(--font-display);
    font-style: italic;
    font-weight: 600;
    font-size: 2rem;
    text-align: center;
    margin: 0 0 0.35rem;
  }
  .auth-tagline {
    text-align: center;
    color: var(--text-muted);
    font-size: 0.85rem;
    margin: 0 0 1.5rem;
  }
  .auth-tabs {
    display: flex;
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 0.2rem;
    margin-bottom: 1.4rem;
  }
  .auth-tabs button {
    flex: 1;
    border: none;
    background: transparent;
    border-radius: 999px;
    padding: 0.4rem 0.5rem;
    font-size: 0.85rem;
  }
  .auth-tabs button.active {
    background: var(--accent);
    color: var(--accent-contrast);
    font-weight: 600;
  }
  .auth-field { margin-bottom: 1rem; }
  .auth-field label {
    display: block;
    font-size: 0.8rem;
    color: var(--text-muted);
    margin-bottom: 0.35rem;
  }
  .auth-error {
    background: color-mix(in srgb, var(--danger) 15%, transparent);
    border: 1px solid var(--danger);
    color: var(--danger);
    font-size: 0.82rem;
    padding: 0.6rem 0.75rem;
    border-radius: 3px;
    margin-bottom: 1rem;
  }
  .auth-submit { width: 100%; padding: 0.65rem; }
  .auth-note {
    text-align: center;
    font-size: 0.74rem;
    color: var(--text-muted);
    margin: 1rem 0 0;
    line-height: 1.5;
  }

  /* ---------- Library ---------- */
  .library-controls {
    display: flex;
    flex-wrap: wrap;
    gap: 0.75rem;
    align-items: center;
    margin-bottom: 1.5rem;
  }
  .library-controls input { flex: 1; min-width: 180px; }

  .filter-chips { display: flex; gap: 0.4rem; flex-wrap: wrap; }
  .chip { padding: 0.35rem 0.75rem; font-size: 0.82rem; border-radius: 999px; }
  .chip.active { background: var(--accent); border-color: var(--accent); color: var(--accent-contrast); }

  .works-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 1rem;
  }

  .work-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 1rem 1.1rem 0.9rem;
    text-align: left;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    min-height: 148px;
  }
  .work-card:hover { border-color: var(--accent); }

  .work-card-top { display: flex; justify-content: space-between; align-items: baseline; gap: 0.5rem; }

  .work-title {
    font-family: var(--font-display);
    font-size: 1.15rem;
    font-weight: 500;
    line-height: 1.3;
    overflow: hidden;
    text-overflow: ellipsis;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }

  .work-type {
    font-size: 0.72rem;
    color: var(--text-muted);
    border: 1px solid var(--border);
    padding: 0.1rem 0.45rem;
    border-radius: 999px;
    white-space: nowrap;
  }

  .work-snippet { font-size: 0.85rem; color: var(--text-muted); line-height: 1.5; flex: 1; overflow: hidden; }
  .work-meta { font-size: 0.76rem; color: var(--text-muted); }

  .empty-state { text-align: center; padding: 3.5rem 1rem; color: var(--text-muted); }
  .empty-state h2 {
    font-family: var(--font-display);
    font-style: italic;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 0.5rem;
  }
  .empty-state .empty-actions { display: flex; gap: 0.6rem; justify-content: center; margin-top: 1.25rem; flex-wrap: wrap; }

  /* ---------- Editor ---------- */
  .editor-toolbar { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; margin-bottom: 1rem; }
  #titleInput { flex: 1; min-width: 140px; font-family: var(--font-display); font-size: 1.05rem; }
  #saveStatus { font-size: 0.78rem; color: var(--text-muted); white-space: nowrap; }

  .page-wrap {
    background: var(--editor-bg);
    color: var(--editor-text);
    border: 1px solid var(--border);
    box-shadow: 0 10px 30px var(--shadow);
    border-radius: 2px;
    padding: 2.25rem clamp(1.25rem, 5vw, 3.5rem);
  }

  #manuscript {
    width: 100%;
    min-height: 50vh;
    border: none;
    resize: none;
    background: transparent;
    color: var(--editor-text);
    font-family: var(--font-body);
    font-size: 1.15rem;
    line-height: 1.75;
    padding: 0;
  }
  #manuscript:focus { outline: none; }
  #manuscript::placeholder { color: #9A8F72; font-style: italic; }

  .editor-footer {
    display: flex;
    justify-content: space-between;
    color: var(--text-muted);
    font-size: 0.8rem;
    margin-top: 0.75rem;
    padding: 0 0.25rem;
  }

  /* ---------- Toast ---------- */
  #toast {
    position: fixed;
    left: 50%;
    bottom: calc(1.5rem + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%);
    background: var(--text);
    color: var(--bg);
    padding: 0.6rem 1rem;
    border-radius: 4px;
    font-size: 0.85rem;
    z-index: 50;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
    max-width: 90vw;
    text-align: center;
  }
  #toast.show { opacity: 1; }

  /* ---------- Footer ---------- */
  .site-footer {
    text-align: center;
    font-size: 0.76rem;
    color: var(--text-muted);
    padding: 1.25rem 1rem calc(1.25rem + env(safe-area-inset-bottom, 0px));
    border-top: 1px solid var(--border);
  }

  @media (max-width: 720px) {
    .brand { font-size: 1.2rem; }
    .page-wrap { padding: 1.5rem 1.1rem; }
    .account-email { display: none; }
  }

  [hidden] { display: none !important; }
</style>
</head>
<body>

<header class="topbar" id="topbar" hidden>
  <div class="brand">Cilboard</div>
  <nav>
    <button id="navLibraryBtn" class="quiet">Library</button>
    <button id="newWorkBtn">New work</button>
  </nav>
  <div class="topbar-right">
    <span class="account-email" id="accountEmailLabel"></span>
    <button id="themeToggle" class="quiet" title="Toggle theme" aria-label="Toggle light and dark theme">◐</button>
    <button id="logoutBtn" class="quiet">Log out</button>
  </div>
</header>

<div id="app">

  <div class="auth-wrap" id="view-auth">
    <div class="auth-card">
      <h1 class="auth-brand">Cilboard</h1>
      <p class="auth-tagline">Where writers keep their drafts and finish their work.</p>
      <div class="auth-tabs">
        <button id="tabLogin" class="active">Log in</button>
        <button id="tabSignup">Sign up</button>
      </div>
      <div class="auth-error" id="authError" hidden></div>
      <div class="auth-field">
        <label for="authEmail">Email</label>
        <input type="email" id="authEmail" autocomplete="email" placeholder="you@example.com">
      </div>
      <div class="auth-field">
        <label for="authPassword">Password</label>
        <input type="password" id="authPassword" autocomplete="current-password" placeholder="At least 6 characters">
      </div>
      <button class="primary auth-submit" id="authSubmitBtn">Log in</button>
      <p class="auth-note">Your account and works are stored only in this browser — they won't sync to another device.</p>
    </div>
  </div>

  <main id="mainArea" hidden>

    <section id="view-library">
      <div class="library-controls">
        <input type="search" id="searchInput" placeholder="Search your works…" aria-label="Search your works">
        <div class="filter-chips" id="filterChips"></div>
      </div>
      <div class="works-grid" id="worksGrid"></div>
      <div class="empty-state" id="emptyState" hidden>
        <h2>Your library is empty</h2>
        <p>Start a new work to begin writing.</p>
        <div class="empty-actions">
          <button class="primary" id="emptyNewWorkBtn">Start a new work</button>
        </div>
      </div>
    </section>

    <section id="view-editor" hidden>
      <div class="editor-toolbar">
        <button id="backBtn" class="quiet">← Library</button>
        <input type="text" id="titleInput" placeholder="Untitled" aria-label="Title">
        <select id="typeSelect" aria-label="Type of work">
          <option value="poem">Poem</option>
          <option value="story">Short story</option>
          <option value="play">Play</option>
          <option value="essay">Essay</option>
          <option value="other">Other</option>
        </select>
        <span id="saveStatus">Saved</span>
        <button id="exportBtn">Export .txt</button>
        <button id="deleteBtn" class="quiet danger-text">Delete</button>
      </div>

      <div class="page-wrap">
        <textarea id="manuscript" placeholder="Begin writing…" spellcheck="true"></textarea>
      </div>

      <div class="editor-footer">
        <span id="wordCount">0 words</span>
        <span id="readTime">0 min read</span>
      </div>
    </section>

  </main>

  <footer class="site-footer">© 2026 TravCodes. All Rights Reserved.</footer>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  "use strict";

  // ---------- Theme ----------
  var THEME_KEY = "cilboard_theme";
  (function initTheme() {
    var saved = localStorage.getItem(THEME_KEY);
    if (saved === "light" || saved === "dark") {
      document.documentElement.setAttribute("data-theme", saved);
    }
  })();
  document.getElementById("themeToggle").addEventListener("click", function () {
    var current = document.documentElement.getAttribute("data-theme");
    var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
    var effectiveDark = current ? current === "dark" : prefersDark;
    var next = effectiveDark ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
  });

  // ---------- Toast ----------
  var toastEl = document.getElementById("toast");
  var toastTimer = null;
  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove("show"); }, 2800);
  }

  function escapeHtml(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  // ---------- Auth (local to this browser only) ----------
  var ACCOUNTS_KEY = "cilboard_accounts_v1";
  var SESSION_KEY = "cilboard_session_v1";

  function loadAccounts() {
    try { return JSON.parse(localStorage.getItem(ACCOUNTS_KEY) || "{}"); }
    catch (e) { return {}; }
  }
  function saveAccounts(accounts) {
    try { localStorage.setItem(ACCOUNTS_KEY, JSON.stringify(accounts)); }
    catch (e) { showToast("Couldn't save account — your browser storage may be full."); }
  }

  async function hashPassword(email, password) {
    var data = new TextEncoder().encode(email.toLowerCase() + "::" + password);
    if (window.crypto && crypto.subtle && crypto.subtle.digest) {
      var buf = await crypto.subtle.digest("SHA-256", data);
      return Array.from(new Uint8Array(buf)).map(function (b) { return b.toString(16).padStart(2, "0"); }).join("");
    }
    // Fallback for environments without SubtleCrypto: simple non-cryptographic hash.
    var str = email.toLowerCase() + "::" + password, hash = 0;
    for (var i = 0; i < str.length; i++) { hash = ((hash << 5) - hash + str.charCodeAt(i)) | 0; }
    return "fallback_" + hash;
  }

  var EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

  var authMode = "login"; // or "signup"
  var authEmail = document.getElementById("authEmail");
  var authPassword = document.getElementById("authPassword");
  var authError = document.getElementById("authError");
  var authSubmitBtn = document.getElementById("authSubmitBtn");
  var tabLogin = document.getElementById("tabLogin");
  var tabSignup = document.getElementById("tabSignup");

  function setAuthMode(mode) {
    authMode = mode;
    tabLogin.classList.toggle("active", mode === "login");
    tabSignup.classList.toggle("active", mode === "signup");
    authSubmitBtn.textContent = mode === "login" ? "Log in" : "Create account";
    authPassword.setAttribute("autocomplete", mode === "login" ? "current-password" : "new-password");
    authError.hidden = true;
  }
  tabLogin.addEventListener("click", function () { setAuthMode("login"); });
  tabSignup.addEventListener("click", function () { setAuthMode("signup"); });

  function showAuthError(msg) {
    authError.textContent = msg;
    authError.hidden = false;
  }

  authSubmitBtn.addEventListener("click", async function () {
    var email = authEmail.value.trim().toLowerCase();
    var password = authPassword.value;

    if (!EMAIL_RE.test(email)) { showAuthError("Enter a valid email address."); return; }
    if (password.length < 6) { showAuthError("Password must be at least 6 characters."); return; }

    var accounts = loadAccounts();
    authSubmitBtn.disabled = true;
    try {
      var hash = await hashPassword(email, password);
      if (authMode === "signup") {
        if (accounts[email]) { showAuthError("An account with that email already exists. Log in instead."); return; }
        accounts[email] = { hash: hash, createdAt: Date.now() };
        saveAccounts(accounts);
        startSession(email);
        showToast("Account created.");
      } else {
        var acct = accounts[email];
        if (!acct || acct.hash !== hash) { showAuthError("Incorrect email or password."); return; }
        startSession(email);
      }
    } finally {
      authSubmitBtn.disabled = false;
    }
  });

  [authEmail, authPassword].forEach(function (el) {
    el.addEventListener("keydown", function (e) {
      if (e.key === "Enter") authSubmitBtn.click();
    });
  });

  var viewAuth = document.getElementById("view-auth");
  var topbar = document.getElementById("topbar");
  var mainArea = document.getElementById("mainArea");
  var accountEmailLabel = document.getElementById("accountEmailLabel");

  function startSession(email) {
    try { localStorage.setItem(SESSION_KEY, email); } catch (e) {}
    enterApp(email);
  }

  document.getElementById("logoutBtn").addEventListener("click", function () {
    try { localStorage.removeItem(SESSION_KEY); } catch (e) {}
    state.currentId = null;
    state.currentUser = null;
    state.works = [];
    viewAuth.hidden = false;
    topbar.hidden = true;
    mainArea.hidden = true;
    authEmail.value = "";
    authPassword.value = "";
    setAuthMode("login");
    authEmail.focus();
  });

  function enterApp(email) {
    state.currentUser = email;
    state.works = loadWorks();
    accountEmailLabel.textContent = email;
    viewAuth.hidden = true;
    topbar.hidden = false;
    mainArea.hidden = false;
    showView("library");
  }

  // ---------- Works storage (scoped per account) ----------
  function worksKey() { return "cilboard_works_v1::" + (state.currentUser || ""); }

  function loadWorks() {
    try {
      var raw = localStorage.getItem(worksKey());
      return raw ? JSON.parse(raw) : [];
    } catch (e) { return []; }
  }
  function persistWorks() {
    try { localStorage.setItem(worksKey(), JSON.stringify(state.works)); }
    catch (e) { showToast("Couldn't save — your browser storage may be full."); }
  }

  function uid() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return "w_" + Date.now() + "_" + Math.random().toString(16).slice(2);
  }

  var TYPE_LABELS = { poem: "Poem", story: "Short story", play: "Play", essay: "Essay", other: "Other" };
  var TYPES = ["poem", "story", "play", "essay", "other"];

  var state = {
    works: [],
    currentId: null,
    currentUser: null,
    filter: "all",
    search: ""
  };

  function snippetOf(text) {
    var t = (text || "").replace(/\s+/g, " ").trim();
    if (!t) return "No content yet.";
    return t.length > 140 ? t.slice(0, 140).trim() + "…" : t;
  }
  function wordCount(text) {
    var t = (text || "").trim();
    if (!t) return 0;
    return t.split(/\s+/).length;
  }
  function formatRelative(ts) {
    var diff = Date.now() - ts;
    var min = Math.floor(diff / 60000);
    if (min < 1) return "just now";
    if (min < 60) return min + " min ago";
    var hr = Math.floor(min / 60);
    if (hr < 24) return hr + " hr ago";
    var day = Math.floor(hr / 24);
    if (day < 7) return day + "d ago";
    return new Date(ts).toLocaleDateString();
  }

  // ---------- Views ----------
  var viewLibrary = document.getElementById("view-library");
  var viewEditor = document.getElementById("view-editor");

  function showView(name) {
    viewLibrary.hidden = name !== "library";
    viewEditor.hidden = name !== "editor";
    if (name === "library") renderLibrary();
  }

  // ---------- Library rendering ----------
  var filterChipsEl = document.getElementById("filterChips");
  var worksGridEl = document.getElementById("worksGrid");
  var emptyStateEl = document.getElementById("emptyState");
  var searchInput = document.getElementById("searchInput");

  function buildFilterChips() {
    var all = [{ key: "all", label: "All" }].concat(TYPES.map(function (t) {
      return { key: t, label: TYPE_LABELS[t] };
    }));
    filterChipsEl.innerHTML = "";
    all.forEach(function (f) {
      var b = document.createElement("button");
      b.className = "chip" + (state.filter === f.key ? " active" : "");
      b.textContent = f.label;
      b.addEventListener("click", function () { state.filter = f.key; renderLibrary(); });
      filterChipsEl.appendChild(b);
    });
  }

  function renderLibrary() {
    buildFilterChips();
    var list = state.works.slice().sort(function (a, b) { return b.updatedAt - a.updatedAt; });

    if (state.filter !== "all") list = list.filter(function (w) { return w.type === state.filter; });
    if (state.search.trim()) {
      var q = state.search.trim().toLowerCase();
      list = list.filter(function (w) {
        return (w.title || "").toLowerCase().indexOf(q) !== -1 || (w.content || "").toLowerCase().indexOf(q) !== -1;
      });
    }

    worksGridEl.innerHTML = "";
    if (state.works.length === 0) {
      emptyStateEl.hidden = false;
      worksGridEl.hidden = true;
      return;
    }
    emptyStateEl.hidden = true;
    worksGridEl.hidden = false;

    if (list.length === 0) {
      var none = document.createElement("p");
      none.style.color = "var(--text-muted)";
      none.textContent = "Nothing matches that search or filter.";
      worksGridEl.appendChild(none);
      return;
    }

    list.forEach(function (w) {
      var card = document.createElement("button");
      card.className = "work-card";
      card.innerHTML =
        '<div class="work-card-top">' +
          '<div class="work-title">' + escapeHtml(w.title || "Untitled") + '</div>' +
          '<div class="work-type">' + TYPE_LABELS[w.type] + '</div>' +
        '</div>' +
        '<div class="work-snippet">' + escapeHtml(snippetOf(w.content)) + '</div>' +
        '<div class="work-meta">Edited ' + formatRelative(w.updatedAt) + ' · ' + wordCount(w.content) + ' words</div>';
      card.addEventListener("click", function () { openEditor(w.id); });
      worksGridEl.appendChild(card);
    });
  }

  searchInput.addEventListener("input", function (e) { state.search = e.target.value; renderLibrary(); });

  // ---------- Editor ----------
  var titleInput = document.getElementById("titleInput");
  var typeSelect = document.getElementById("typeSelect");
  var manuscript = document.getElementById("manuscript");
  var saveStatus = document.getElementById("saveStatus");
  var wordCountEl = document.getElementById("wordCount");
  var readTimeEl = document.getElementById("readTime");
  var saveTimer = null;

  function findWork(id) {
    for (var i = 0; i < state.works.length; i++) if (state.works[i].id === id) return state.works[i];
    return null;
  }

  function openEditor(id) {
    var w = findWork(id);
    if (!w) return;
    state.currentId = id;
    titleInput.value = w.title || "";
    typeSelect.value = w.type || "other";
    manuscript.value = w.content || "";
    updateCounts();
    saveStatus.textContent = "Saved";
    showView("editor");
    autoResize();
  }

  function createWork(overrides) {
    var w = Object.assign({
      id: uid(), title: "", type: "poem", content: "",
      createdAt: Date.now(), updatedAt: Date.now()
    }, overrides || {});
    state.works.push(w);
    persistWorks();
    return w;
  }

  function updateCounts() {
    var wc = wordCount(manuscript.value);
    wordCountEl.textContent = wc + (wc === 1 ? " word" : " words");
    readTimeEl.textContent = Math.max(1, Math.round(wc / 200)) + " min read";
  }

  function scheduleSave() {
    saveStatus.textContent = "Saving…";
    clearTimeout(saveTimer);
    saveTimer = setTimeout(flushSave, 500);
  }

  function flushSave() {
    var w = findWork(state.currentId);
    if (!w) return;
    w.title = titleInput.value;
    w.type = typeSelect.value;
    w.content = manuscript.value;
    w.updatedAt = Date.now();
    persistWorks();
    saveStatus.textContent = "Saved";
  }

  function autoResize() {
    manuscript.style.height = "auto";
    manuscript.style.height = Math.max(manuscript.scrollHeight, 320) + "px";
  }

  titleInput.addEventListener("input", scheduleSave);
  typeSelect.addEventListener("change", scheduleSave);
  manuscript.addEventListener("input", function () { updateCounts(); autoResize(); scheduleSave(); });

  document.getElementById("newWorkBtn").addEventListener("click", function () { openEditor(createWork({}).id); });
  document.getElementById("emptyNewWorkBtn").addEventListener("click", function () { openEditor(createWork({}).id); });
  document.getElementById("navLibraryBtn").addEventListener("click", function () {
    clearTimeout(saveTimer);
    if (state.currentId) flushSave();
    state.currentId = null;
    showView("library");
  });
  document.getElementById("backBtn").addEventListener("click", function () {
    clearTimeout(saveTimer);
    if (state.currentId) flushSave();
    state.currentId = null;
    showView("library");
  });

  document.getElementById("deleteBtn").addEventListener("click", function () {
    var w = findWork(state.currentId);
    if (!w) return;
    var ok = confirm('Delete "' + (w.title || "Untitled") + '"? This can\'t be undone.');
    if (!ok) return;
    state.works = state.works.filter(function (x) { return x.id !== w.id; });
    persistWorks();
    state.currentId = null;
    showView("library");
    showToast("Work deleted.");
  });

  // ---------- Export ----------
  async function getDownloads() {
    if (typeof window.claude === "undefined") return null;
    try { return await window.claude.use("downloads"); } catch (e) { return null; }
  }

  document.getElementById("exportBtn").addEventListener("click", async function () {
    var w = findWork(state.currentId);
    if (!w) return;
    flushSave();
    var downloads = await getDownloads();
    if (!downloads) { showToast("Export isn't available in this view."); return; }
    var filename = (w.title || "untitled").trim().replace(/[^a-z0-9\-_ ]/gi, "").replace(/\s+/g, "-").toLowerCase() || "untitled";
    try { await downloads.save({ filename: filename + ".txt", data: w.content || "" }); }
    catch (e) { showToast("Couldn't export right now."); }
  });

  // ---------- Init ----------
  setAuthMode("login");
  var existingSession = null;
  try { existingSession = localStorage.getItem(SESSION_KEY); } catch (e) {}
  if (existingSession) {
    enterApp(existingSession);
  } else {
    viewAuth.hidden = false;
  }
})();
</script>

</body>
</html>
